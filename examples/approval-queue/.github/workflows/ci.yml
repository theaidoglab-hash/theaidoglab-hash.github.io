name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-demo:
    name: Test and demo on Node.js 20
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Run deterministic regression tests
        run: npm test
      - name: Run synthetic demonstration
        run: npm run demo
