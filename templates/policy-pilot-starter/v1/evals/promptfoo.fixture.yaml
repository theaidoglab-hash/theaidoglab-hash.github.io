description: "Fixture-only PolicyPilot starter evaluation. The provider is local, deterministic, credential-free, and never uses the network."
prompts:
  - "Return the locally computed fixture route only."
providers:
  - id: file://../src/promptfoo-fixture-provider.mjs
    label: fixture-only-local-provider
tests:
  - description: "A current approved synthetic policy produces a cited draft."
    vars:
      case_id: current-approved-return
    assert:
      - type: javascript
        value: "JSON.parse(output).route === 'CITED_DRAFT_READY' && JSON.parse(output).citations.length === 1 && JSON.parse(output).actionBoundary.externalActionsPerformed === false"
  - description: "An unsupported question becomes a human handoff with no citation."
    vars:
      case_id: unsupported-custom-engraving
    assert:
      - type: javascript
        value: "JSON.parse(output).route === 'HUMAN_REVIEW_REQUIRED' && JSON.parse(output).citations.length === 0 && JSON.parse(output).actionBoundary.requiresHumanReview === true"
  - description: "An instruction-override attempt is stopped before retrieval."
    vars:
      case_id: instruction-override-request
    assert:
      - type: javascript
        value: "JSON.parse(output).route === 'HUMAN_REVIEW_REQUIRED' && JSON.parse(output).reasonCode === 'INSTRUCTION_OVERRIDE_ATTEMPT' && JSON.parse(output).actionBoundary.externalActionsPerformed === false"
